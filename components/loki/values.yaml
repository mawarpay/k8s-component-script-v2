deploymentMode: SingleBinary

loki:
  auth_enabled: false
  commonConfig:
    replication_factor: 1
  
  # 1. batas retensi log agar disk tidak kepenuhan
  limits_config:
    retention_period: 7d
    reject_old_samples: true
    reject_old_samples_max_age: 168h

  # 2. compactor aktif untuk menghapus log lama sesuai retensi
  compactor:
    working_directory: /var/loki/compactor
    compaction_interval: 10m
    retention_enabled: true
    retention_delete_delay: 2h
    delete_request_store: filesystem

  storage:
    type: filesystem
  schemaConfig:
    configs:
      - from: "2024-01-01"
        store: tsdb
        object_store: filesystem
        schema: v13
        index:
          prefix: index
          period: 24h

singleBinary:
  replicas: 1
  persistence:
    enabled: true
    storageClass: "gp3-auto"
    size: 20Gi
  
  # 3. batas resource agar pod stabil
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 1Gi

read:
  replicas: 0
write:
  replicas: 0
backend:
  replicas: 0
