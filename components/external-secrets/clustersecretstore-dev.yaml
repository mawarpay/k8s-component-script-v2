# Store untuk environment dev (namespace k8s "default").
#
# Sebelumnya store ini cuma ada di cluster, tidak pernah masuk Git - isinya
# disalin dari objek yang hidup di cluster (kubectl get clustersecretstore
# vault-kv) supaya perubahan berikutnya punya jejak.
#
# Role Vault "eso" harus dibatasi ke secret/data/dev/* saja. Kalau masih
# memakai policy yang mengizinkan secret/data/*, pemisahan dev/prod tidak
# berarti apa-apa: ExternalSecret di namespace default bisa menarik secret
# prod. Lihat README.md di folder ini.
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: vault-kv
spec:
  # Dibatasi ke namespace dev supaya kebalikannya juga tertutup: ExternalSecret
  # di namespace prod tidak bisa diam-diam menarik kredensial dev.
  #
  # Objek yang hidup di cluster saat ini BELUM punya blok ini - menerapkannya
  # akan menghentikan ExternalSecret di namespace lain yang memakai store ini.
  # Cek dulu: kubectl get externalsecrets -A
  conditions:
    - namespaces:
        - default
  provider:
    vault:
      server: http://vault.vault.svc.cluster.local:8200
      path: secret
      version: v2
      auth:
        kubernetes:
          mountPath: kubernetes
          role: eso
          serviceAccountRef:
            name: external-secrets
            namespace: external-secrets
