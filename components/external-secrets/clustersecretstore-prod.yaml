# Store untuk environment prod (namespace k8s "prod").
#
# Vault-nya sama persis dengan dev - yang berbeda cuma role, dan role itulah
# satu-satunya hal yang menahan namespace default menarik secret prod. Path
# "secret/prod/*" sendiri bukan batas keamanan: ExternalSecret mana pun boleh
# menyebut key apa pun selama store yang dipakainya diizinkan membacanya.
#
# Chart app memilih store lewat vault.storeName, dan nilainya dipaksa workflow
# deploy dari input `env` - tidak bisa di-override dari file values.
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: vault-kv-prod
spec:
  # Kedua role Vault terikat ke ServiceAccount yang sama (external-secrets),
  # jadi role sendiri tidak memisahkan siapa boleh baca apa - ESO bisa ambil
  # token untuk dua-duanya. Yang benar-benar menahan adalah conditions:
  # ExternalSecret di luar namespace prod ditolak store ini.
  conditions:
    - namespaces:
        - prod
  provider:
    vault:
      server: http://vault.vault.svc.cluster.local:8200
      path: secret
      version: v2
      auth:
        kubernetes:
          mountPath: kubernetes
          role: eso-prod
          serviceAccountRef:
            name: external-secrets
            namespace: external-secrets
