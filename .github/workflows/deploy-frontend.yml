name: Reusable Frontend deploy to EKS
on:
  workflow_call:
    inputs:
      service_name:
        required: true
        type: string
      namespace:
        required: false
        type: string
        default: dev
      chart_version:
        required: false
        type: string
        default: "0.1.2"
    secrets:
      AWS_ACCESS_KEY_ID:
        required: true
      AWS_SECRET_ACCESS_KEY:
        required: true
      AWS_ACCOUNT_ID:
        required: true
      # Tambahkan secrets VITE
      VITE_API_BASE_URL:
        required: true

env:
  AWS_REGION: ap-southeast-1
  CLUSTER_NAME: dev

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build & push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.ecr.outputs.registry }}/${{ inputs.service_name }}:${{ github.sha }}
            ${{ steps.ecr.outputs.registry }}/${{ inputs.service_name }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # Injeksi variabel environment Vite ke dalam Docker Build
          build-args: |
            VITE_API_BASE_URL=${{ secrets.VITE_API_BASE_URL }}

      - name: Checkout helm values
        uses: actions/checkout@v4
        with:
          repository: mawarpay/helm-charts-v2
          path: helm-charts

      - name: Update kubeconfig
        run: aws eks update-kubeconfig --region $AWS_REGION --name $CLUSTER_NAME

      - name: Helm login to ECR
        run: |
          aws ecr get-login-password --region $AWS_REGION | \
          helm registry login --username AWS --password-stdin \
          ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.$AWS_REGION.amazonaws.com

      - name: Helm dry-run
        run: |
          helm upgrade --install ${{ inputs.service_name }} \
          oci://${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.$AWS_REGION.amazonaws.com/helm/app \
          --version ${{ inputs.chart_version }} \
          --namespace default --create-namespace \
          -f helm-charts/values/${{ inputs.namespace }}/${{ inputs.service_name }}.yaml \
          --set image.tag=${{ github.sha }} \
          --dry-run --debug

      - name: Deploy with Helm
        run: |
          helm upgrade --install ${{ inputs.service_name }} \
          oci://${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.$AWS_REGION.amazonaws.com/helm/app \
          --version ${{ inputs.chart_version }} \
          --namespace default --create-namespace \
          -f helm-charts/values/${{ inputs.namespace }}/${{ inputs.service_name }}.yaml \
          --set image.tag=${{ github.sha }} \
          --wait --timeout 5m

      - name: Verify rollout
        run: |
          kubectl rollout status deployment/${{ inputs.service_name }} \
          -n default --timeout=180s