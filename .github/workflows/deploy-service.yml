name: Reusable Go deploy to EKS
#
# Dev dan prod berbagi satu cluster EKS dan satu Vault. Yang membedakan cuma
# tiga hal, dan ketiganya diturunkan dari input `env` di job `setup` - jangan
# pernah ditulis manual di step lain:
#
#   env    namespace k8s   values                        Vault
#   dev    default         values/dev/<service>.yaml     secret/dev/*
#   prod   prod            values/prod/<service>.yaml    secret/prod/*
#
on:
  workflow_call:
    inputs:
      service_name:
        required: true
        type: string
      env:
        required: false
        type: string
        default: ""
        description: >-
          "dev" atau "prod". Kalau dikosongkan, dipakai nilai input `namespace`
          (jalur lama) supaya caller yang belum dimigrasi tetap jalan.
      namespace:
        required: false
        type: string
        default: ""
        description: >-
          DEPRECATED - alias lama untuk `env`. Dulu namanya "namespace" padahal
          isinya nama folder values, bukan namespace k8s. Pakai `env`.
      chart_version:
        required: false
        type: string
        default: "0.1.3"
      go_version:
        required: false
        type: string
        default: "1.22"
      run_tests:
        required: false
        type: boolean
        default: true
      promote_image:
        required: false
        type: boolean
        default: false
        description: >-
          Jangan build image, pakai yang sudah ada di ECR untuk commit ini.
          Dipakai jalur prod: biner yang jalan di prod jadi persis byte-per-byte
          yang sudah diuji di dev, bukan hasil compile ulang. Workflow gagal
          kalau image-nya belum ada - artinya commit ini memang belum pernah
          lewat dev.
      system_packages:
        required: false
        type: string
        default: ""
        description: >-
          Paket apt yang dipasang di runner sebelum go vet/test, dipisah spasi.
          Dipakai service yang punya dependency cgo (misal image-service-api
          butuh "libvips-dev" untuk github.com/h2non/bimg).
      run_migrations:
        required: false
        type: boolean
        default: true
        description: >-
          Jalankan migrasi golang-migrate sebelum deploy. Auto-skip kalau repo
          tidak punya file .sql di migrations_path, jadi aman dibiarkan true
          untuk service yang belum punya migrasi. Set false kalau migrasi mau
          dijalankan manual.
      migrations_path:
        required: false
        type: string
        default: migrations
        description: Folder berisi file .up.sql/.down.sql golang-migrate.
      migrate_version:
        required: false
        type: string
        default: v4.18.1
        description: Tag image migrate/migrate yang dipakai Job migrasi.
    secrets:
      AWS_ACCESS_KEY_ID:
        required: true
      AWS_SECRET_ACCESS_KEY:
        required: true
      AWS_ACCOUNT_ID:
        required: true

env:
  AWS_REGION: ap-southeast-1
  # Dev dan prod satu cluster - yang memisahkan keduanya adalah namespace,
  # bukan cluster.
  CLUSTER_NAME: dev


jobs:
  # ---------- Job 0: turunkan semua yang bergantung environment ----------
  setup:
    runs-on: ubuntu-latest
    outputs:
      env: ${{ steps.resolve.outputs.env }}
      ns: ${{ steps.resolve.outputs.ns }}
      vault_store: ${{ steps.resolve.outputs.vault_store }}
      moving_tag: ${{ steps.resolve.outputs.moving_tag }}
    steps:
      - name: Resolve environment
        id: resolve
        env:
          RAW_ENV: ${{ inputs.env }}
          RAW_NS: ${{ inputs.namespace }}
        run: |
          set -euo pipefail
          ENV="${RAW_ENV:-$RAW_NS}"

          case "$ENV" in
            dev)
              NS=default
              STORE=vault-kv
              MOVING=latest
              ;;
            prod)
              NS=prod
              # ClusterSecretStore terpisah dengan token Vault yang policy-nya
              # cuma secret/data/prod/*. Karena dev dan prod satu cluster,
              # ClusterSecretStore yang sama akan bikin ExternalSecret di
              # namespace default bisa menarik secret prod - pemisahan path saja
              # tidak menahan apa pun tanpa ini.
              STORE=vault-kv-prod
              MOVING=prod
              ;;
            "")
              echo '::error::input "env" (atau "namespace") wajib diisi: dev | prod.'
              exit 1
              ;;
            *)
              echo "::error::environment tidak dikenal: '$ENV'. Yang valid: dev | prod."
              exit 1
              ;;
          esac

          if [ -z "$RAW_ENV" ]; then
            echo "::warning::Caller masih pakai input 'namespace' yang deprecated. Ganti jadi 'env: $ENV'."
          fi

          echo "env=$ENV" >> "$GITHUB_OUTPUT"
          echo "ns=$NS" >> "$GITHUB_OUTPUT"
          echo "vault_store=$STORE" >> "$GITHUB_OUTPUT"
          echo "moving_tag=$MOVING" >> "$GITHUB_OUTPUT"

          echo "env=$ENV namespace=$NS store=$STORE"

  # ---------- Job 1: test (Go) ----------
  test:
    runs-on: ubuntu-latest
    # Jalur prod mem-promote image yang sudah lolos test di jalur dev, jadi
    # test-nya tidak diulang - caller prod mengirim run_tests: false.
    if: inputs.run_tests
    steps:
      - uses: actions/checkout@v4

      # Dependency cgo (bimg/libvips dsb) butuh header + .pc file di runner,
      # kalau nggak ada `go vet` gagal di "Package vips was not found".
      - name: Pasang paket sistem
        if: inputs.system_packages != ''
        env:
          PKGS: ${{ inputs.system_packages }}
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends $PKGS

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ inputs.go_version }}
          cache: true

      - name: Download modules
        run: go mod download

      - name: go vet
        run: go vet ./...

      - name: go test
        run: go test -race -count=1 -timeout 5m ./...

  # --------- Job 2: build image + deploy ---------
  build-and-deploy:
    runs-on: ubuntu-latest
    needs: [setup, test]
    # tetap jalan walau job test di-skip (run_tests=false)
    if: always() && needs.setup.result == 'success' && (needs.test.result == 'success' || needs.test.result == 'skipped')
    env:
      ENV: ${{ needs.setup.outputs.env }}
      NS: ${{ needs.setup.outputs.ns }}
      VAULT_STORE: ${{ needs.setup.outputs.vault_store }}
      MOVING_TAG: ${{ needs.setup.outputs.moving_tag }}
    steps:
      - uses: actions/checkout@v4

      # Service yang belum punya folder migrations (mayoritas repo) harus tetap
      # bisa deploy tanpa mengubah workflow pemanggilnya, jadi keberadaan
      # migrasi dideteksi di sini dan dipakai sebagai gate semua step migrasi.
      - name: Deteksi migrations
        id: migrations
        env:
          MIGRATIONS_PATH: ${{ inputs.migrations_path }}
        run: |
          if [ "${{ inputs.run_migrations }}" != "true" ]; then
            echo "run_migrations=false, migrasi dilewati."
            echo "found=false" >> "$GITHUB_OUTPUT"
          elif [ -n "$(find "$MIGRATIONS_PATH" -maxdepth 1 -name '*.sql' -print -quit 2>/dev/null)" ]; then
            echo "Ditemukan $(find "$MIGRATIONS_PATH" -maxdepth 1 -name '*.up.sql' | wc -l) migrasi di '$MIGRATIONS_PATH'."
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "Tidak ada file .sql di '$MIGRATIONS_PATH', migrasi dilewati."
            echo "found=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      # Bikin ECR repository kalau belum ada, biar service baru nggak gagal
      # di step "Build & push image" dengan RepositoryNotFoundException.
      - name: Pastikan ECR repository ada
        if: ${{ !inputs.promote_image }}
        env:
          SVC: ${{ inputs.service_name }}
          WITH_MIGRATIONS: ${{ steps.migrations.outputs.found }}
        run: |
          ensure_repo() {
            if aws ecr describe-repositories --region "$AWS_REGION" --repository-names "$1" >/dev/null 2>&1; then
              echo "ECR repository '$1' sudah ada."
            else
              echo "ECR repository '$1' belum ada - membuat..."
              aws ecr create-repository \
                --region "$AWS_REGION" \
                --repository-name "$1" \
                --image-tag-mutability MUTABLE \
                --encryption-configuration encryptionType=AES256 >/dev/null \
              || aws ecr describe-repositories --region "$AWS_REGION" --repository-names "$1" >/dev/null
              echo "ECR repository '$1' siap."
            fi
          }
          ensure_repo "$SVC"
          # Image migrasi dipisah dari image service: image service cuma berisi
          # binary (lihat Dockerfile tiap service), tidak ada folder migrations
          # maupun CLI migrate di dalamnya.
          if [ "$WITH_MIGRATIONS" = "true" ]; then
            ensure_repo "$SVC-migrations"
          fi

      - name: Login ke Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      # ---- jalur promote (prod): tidak build apa pun ----
      #
      # Tag git v* menunjuk commit yang sudah pernah di-push ke main, jadi
      # image-nya sudah dibangun jalur dev. Kalau ternyata belum ada, itu bukan
      # kondisi yang boleh "diperbaiki" dengan build baru di sini: berarti
      # commit ini belum pernah dites di dev, dan itu justru yang mau dicegah.
      - name: Pastikan image sudah ada di ECR
        if: inputs.promote_image
        env:
          SVC: ${{ inputs.service_name }}
          SHA: ${{ github.sha }}
          WITH_MIGRATIONS: ${{ steps.migrations.outputs.found }}
        run: |
          set -euo pipefail
          require_image() {
            if aws ecr describe-images --region "$AWS_REGION" \
                 --repository-name "$1" --image-ids "imageTag=$SHA" >/dev/null 2>&1; then
              echo "Image $1:$SHA ditemukan."
            else
              echo "::error::Image $1:$SHA belum ada di ECR."
              echo "Commit ini belum pernah dideploy ke dev. Push ke main dulu, tunggu"
              echo "jalur dev selesai, baru tag commit yang sama untuk prod."
              exit 1
            fi
          }
          require_image "$SVC"
          if [ "$WITH_MIGRATIONS" = "true" ]; then
            require_image "$SVC-migrations"
          fi

      - name: Setup Docker Buildx
        if: ${{ !inputs.promote_image }}
        uses: docker/setup-buildx-action@v3

      - name: Build & push image (dengan layer cache)
        if: ${{ !inputs.promote_image }}
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.ecr.outputs.registry }}/${{ inputs.service_name }}:${{ github.sha }}
            ${{ steps.ecr.outputs.registry }}/${{ inputs.service_name }}:${{ needs.setup.outputs.moving_tag }}
          # cache layer Docker di GitHub - build Go berikutnya jauh lebih cepat
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            GO_VERSION=${{ inputs.go_version }}

      # RDS tidak publicly accessible, jadi migrasi tidak bisa dijalankan
      # langsung dari runner GitHub - harus lewat Job di dalam cluster. Image
      # kecil ini yang dipakai Job tersebut.
      - name: Build & push image migrasi
        if: ${{ !inputs.promote_image && steps.migrations.outputs.found == 'true' }}
        env:
          MIGRATIONS_PATH: ${{ inputs.migrations_path }}
          MIGRATE_VERSION: ${{ inputs.migrate_version }}
        run: |
          cat > Dockerfile.migrations <<EOF
          FROM migrate/migrate:${MIGRATE_VERSION}
          COPY ${MIGRATIONS_PATH} /migrations
          # Jaga-jaga kalau nanti ada .dockerignore yang meng-exclude folder
          # migrations: lebih baik gagal di build daripada Job "sukses" tanpa
          # menjalankan satu migrasi pun.
          RUN [ -n "\$(ls -A /migrations 2>/dev/null)" ] || { echo "/migrations kosong"; exit 1; }
          EOF
          IMG="${{ steps.ecr.outputs.registry }}/${{ inputs.service_name }}-migrations:${{ github.sha }}"
          docker build -f Dockerfile.migrations -t "$IMG" .
          docker push "$IMG"

      # Tag bergerak ("prod") ditempel ke manifest yang sudah ada, bukan lewat
      # build ulang - digest-nya harus tetap sama dengan yang diuji di dev.
      - name: Tempel tag ${{ needs.setup.outputs.moving_tag }} ke image
        if: inputs.promote_image
        env:
          SVC: ${{ inputs.service_name }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          MANIFEST="$(aws ecr batch-get-image --region "$AWS_REGION" \
            --repository-name "$SVC" --image-ids "imageTag=$SHA" \
            --query 'images[0].imageManifest' --output text)"
          # Gagal kalau tag sudah menunjuk manifest yang sama - itu bukan error.
          aws ecr put-image --region "$AWS_REGION" \
            --repository-name "$SVC" --image-tag "$MOVING_TAG" \
            --image-manifest "$MANIFEST" >/dev/null 2>&1 \
            || echo "Tag $MOVING_TAG sudah menunjuk image ini."
          echo "$SVC:$MOVING_TAG -> $SHA"

      - name: Checkout helm values
        uses: actions/checkout@v4
        with:
          repository: mawarpay/helm-charts-v2
          path: helm-charts
          # Kalau helm-charts private, tambahkan fine-grained PAT:
          # token: ${{ secrets.GH_PAT_READ_HELM_CHARTS }}

      # helm sendiri akan gagal kalau -f menunjuk file yang tidak ada, tapi
      # errornya ("open ...: no such file") tidak menyebut bahwa yang kurang
      # adalah values untuk environment ini.
      - name: Pastikan values environment ada
        env:
          SVC: ${{ inputs.service_name }}
        run: |
          VALUES="helm-charts/values/$ENV/$SVC.yaml"
          if [ ! -f "$VALUES" ]; then
            echo "::error::$VALUES tidak ada di helm-charts-v2."
            echo "Buat dulu values untuk environment '$ENV' sebelum deploy ke sana."
            exit 1
          fi
          echo "Pakai $VALUES"

      - name: Update kubeconfig
        run: aws eks update-kubeconfig --region $AWS_REGION --name $CLUSTER_NAME

      # Dijalankan SEBELUM helm upgrade supaya pod versi baru tidak sempat
      # jalan di atas schema lama. Kalau migrasi gagal, deploy ikut dibatalkan.
      - name: Jalankan migrasi database (Job in-cluster)
        if: steps.migrations.outputs.found == 'true'
        env:
          SVC: ${{ inputs.service_name }}
          IMG: ${{ steps.ecr.outputs.registry }}/${{ inputs.service_name }}-migrations:${{ github.sha }}
        run: |
          set -euo pipefail
          SECRET="$SVC-vault"

          # Secret ini dibuat ExternalSecret milik chart, jadi belum ada waktu
          # service dideploy paling pertama - termasuk saat service yang sudah
          # lama jalan di dev pertama kali masuk ke namespace prod.
          if ! kubectl get secret "$SECRET" -n "$NS" >/dev/null 2>&1; then
            echo "::error::Secret '$SECRET' belum ada di namespace $NS."
            echo "Untuk deploy pertama kali ke environment ini: jalankan sekali dengan"
            echo "run_migrations: false supaya ExternalSecret terbentuk, lalu jalankan"
            echo "ulang workflow-nya."
            exit 1
          fi

          JOB="$SVC-migrate-$(echo "${{ github.sha }}" | cut -c1-7)"
          kubectl delete job "$JOB" -n "$NS" --ignore-not-found

          # Ledger golang-migrate per service.
          #
          # Beberapa service memakai database yang sama (mis. va-service dan
          # qris-service sama-sama DB_NAME=base), sementara set migrasinya
          # berbeda. Dengan tabel ledger default (schema_migrations) keduanya
          # berbagi satu nomor versi: yang migrasi terakhir menang, lalu job
          # service lain mati dengan
          #   "no migration found for version N: file does not exist"
          # karena nomor itu tidak ada di direktori migrations miliknya.
          # Terbukti di dev 2026-08-01: va-service naik ke 17, qris-service
          # (maksimum 14) langsung terblokir.
          #
          # x-migrations-table memberi tiap service ledger sendiri di database
          # yang sama. Tanda hubung tidak dipakai supaya nama tabel tetap
          # identifier MySQL yang wajar.
          MIG_TABLE="schema_migrations_$(echo "$SVC" | tr '-' '_')"
          echo "Ledger migrasi: $MIG_TABLE (namespace $NS)"

          kubectl apply -f - <<EOF
          apiVersion: batch/v1
          kind: Job
          metadata:
            name: $JOB
            namespace: $NS
          spec:
            backoffLimit: 0
            ttlSecondsAfterFinished: 600
            template:
              spec:
                restartPolicy: Never
                containers:
                  - name: migrate
                    image: $IMG
                    envFrom:
                      - secretRef:
                          name: $SECRET
                    command: ["/bin/sh", "-c"]
                    args:
                      - |
                        set -eu
                        LC_ALL=C; export LC_ALL
                        : "\${DB_HOST:?DB_HOST kosong di $SECRET}"
                        : "\${DB_USER:?DB_USER kosong di $SECRET}"
                        : "\${DB_PASSWORD:?DB_PASSWORD kosong di $SECRET}"
                        : "\${DB_NAME:?DB_NAME kosong di $SECRET}"
                        # Password dari Vault bisa memuat karakter yang merusak
                        # DSN (@ : / ? #), jadi di-percent-encode dulu.
                        # Oktal, bukan heks: printf "\\0NNN" dibaca sebagian sh
                        # sebagai \\0NN + digit sisa, dan \\xNN tidak POSIX.
                        urlenc() {
                          printf '%s' "\$1" | od -An -to1 -v | tr -s ' ' '\n' | grep -v '^\$' |
                          while read -r o; do
                            c=\$(printf "\\\\\$o")
                            case "\$c" in
                              [A-Za-z0-9.~_-]) printf '%s' "\$c" ;;
                              *) printf '%%%02X' "0\$o" ;;
                            esac
                          done
                        }
                        URL="mysql://\$(urlenc "\$DB_USER"):\$(urlenc "\$DB_PASSWORD")@tcp(\${DB_HOST}:\${DB_PORT:-3306})/\${DB_NAME}?charset=utf8mb4&parseTime=true&x-migrations-table=${MIG_TABLE}"
                        # golang-migrate mencetak DSN utuh - termasuk password -
                        # pada setiap error koneksi, dan log Job ini terbaca oleh
                        # siapa pun yang punya akses kubectl atau log workflow.
                        # Contoh nyata 2026-08-01 di withdraw-service-api:
                        #   Error 1045: Access denied for user 'admin'
                        # dicetak bersama DSN lengkapnya. Jadi output migrate
                        # disaring dulu. Exit code tetap diteruskan apa adanya -
                        # menelan status gagal jauh lebih berbahaya daripada
                        # bocornya password.
                        ENC_PASS=\$(urlenc "\$DB_PASSWORD")
                        redact() { sed "s|:\${ENC_PASS}@|:***@|g"; }

                        echo "ledger: ${MIG_TABLE} di database \${DB_NAME}"
                        echo "versi sebelum migrasi:"
                        migrate -path=/migrations -database "\$URL" version 2>&1 | redact || true

                        set +e
                        migrate -path=/migrations -database "\$URL" up >/tmp/migrate.log 2>&1
                        rc=\$?
                        set -e
                        redact </tmp/migrate.log
                        exit \$rc
          EOF

          echo "Menunggu Job $JOB selesai..."
          deadline=$(( $(date +%s) + 600 ))
          state=timeout
          while [ "$(date +%s)" -lt "$deadline" ]; do
            if [ "$(kubectl get job "$JOB" -n "$NS" -o jsonpath='{.status.succeeded}' 2>/dev/null || true)" = "1" ]; then
              state=ok
              break
            fi
            failed=$(kubectl get job "$JOB" -n "$NS" -o jsonpath='{.status.failed}' 2>/dev/null || true)
            if [ -n "$failed" ] && [ "$failed" != "0" ]; then
              state=fail
              break
            fi
            sleep 5
          done

          echo "----- log migrasi -----"
          kubectl logs "job/$JOB" -n "$NS" --tail=300 || true
          echo "-----------------------"

          if [ "$state" != "ok" ]; then
            echo "::error::Migrasi $SVC $state - deploy dibatalkan."
            kubectl describe job "$JOB" -n "$NS" || true
            exit 1
          fi

          kubectl delete job "$JOB" -n "$NS" --ignore-not-found
          echo "Migrasi $SVC selesai."

      - name: Helm login ke ECR
        run: |
          aws ecr get-login-password --region $AWS_REGION | \
          helm registry login --username AWS --password-stdin \
          ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.$AWS_REGION.amazonaws.com

      # vault.stage dan vault.storeName selalu dipaksa dari sini, tidak dibaca
      # dari file values. Kalau values/prod/<svc>.yaml lupa menyetel keduanya,
      # default chart (stage dev, store vault-kv) akan bikin pod prod jalan di
      # atas kredensial dev tanpa satu pun error - kegagalan paling mahal yang
      # bisa terjadi di setup satu-cluster ini.
      - name: Helm dry-run (debug manifest)
        run: |
          helm upgrade --install ${{ inputs.service_name }} \
          oci://${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.$AWS_REGION.amazonaws.com/helm/app \
          --version ${{ inputs.chart_version }} \
          --namespace "$NS" --create-namespace \
          -f helm-charts/values/$ENV/${{ inputs.service_name }}.yaml \
          --set image.tag=${{ github.sha }} \
          --set vault.stage=$ENV \
          --set vault.storeName=$VAULT_STORE \
          --dry-run --debug

      - name: Deploy dengan Helm
        run: |
          helm upgrade --install ${{ inputs.service_name }} \
          oci://${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.$AWS_REGION.amazonaws.com/helm/app \
          --version ${{ inputs.chart_version }} \
          --namespace "$NS" --create-namespace \
          -f helm-charts/values/$ENV/${{ inputs.service_name }}.yaml \
          --set image.tag=${{ github.sha }} \
          --set vault.stage=$ENV \
          --set vault.storeName=$VAULT_STORE \
          --wait --timeout 5m

      - name: Verifikasi rollout
        run: |
          kubectl rollout status deployment/${{ inputs.service_name }} \
          -n "$NS" --timeout=180s
